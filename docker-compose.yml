# Geliştirme ortamı. Üretim için değildir.
#
# Buradaki parolalar bilerek düz metin ve zayıf: yalnızca localhost'a bağlı,
# yalnızca geliştirme verisi tutan kaplar. Gerçek kimlik bilgileri hiçbir zaman
# bu dosyaya girmez — onlar şifreli credential deposunda durur (P1-01).

name: bytemounts-ai-studio

services:
  postgres:
    # pgvector'ün resmi imajı: PostgreSQL 16 + eklenti derlenmiş halde gelir.
    # Düz postgres:16 imajına eklentiyi elle kurmak her makinede tekrar iş çıkarır.
    image: pgvector/pgvector:pg16
    container_name: bmai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bmai
      POSTGRES_PASSWORD: bmai_dev
      POSTGRES_DB: bmai
      # Türkçe/İngilizce içerik aynı veritabanında: sıralama ve karşılaştırma
      # kültürden bağımsız olsun ki dil değişince indeks davranışı değişmesin.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
    ports:
      # 127.0.0.1'e bağlı: varsayılan 0.0.0.0 bu veritabanını yerel ağa açardı
      # ve parola zaten geliştirme parolası. Erişim yalnızca bu makineden.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Uygulama, kap "başladı" dediğinde değil, gerçekten sorgu kabul ettiğinde
      # bağlanmalı. Aksi hâlde ilk migration rastgele başarısız olur.
      test: ["CMD-SHELL", "pg_isready -U bmai -d bmai"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  seq:
    # Yapılandırılmış log deposu. Bir run'ın tüm adımlarını tek correlation id
    # ile filtrelemek buradan yapılacak (P0-05).
    image: datalust/seq:latest
    container_name: bmai-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Seq 2026 ilk açılışta yönetici parolası ister; vermezsek çöker.
      # Bu kap yalnızca 127.0.0.1'e bağlı ve geliştirme logu tutuyor —
      # yönetilecek bir parola eklemek yerine kimlik doğrulaması kapalı.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5341:5341"   # log alım (ingestion)
      - "127.0.0.1:8081:80"     # web arayüzü -> http://localhost:8081
    volumes:
      - seq-data:/data

  # Meta arama motoru. Anahtarsız genel web araması için en sağlam yol.
  # `--profile tools` ile ayrı başlatılıyor: her geliştirme oturumunda
  # gerekmiyor ve boşuna bellek tüketmesin.
  searxng:
    image: searxng/searxng:latest
    container_name: bmai-searxng
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      # JSON çıktısı varsayılan olarak KAPALI geliyor; ayar dosyasıyla açılıyor.
      SEARXNG_BASE_URL: "http://localhost:8888/"
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
      - searxng-data:/var/cache/searxng

  # Araclar yan-servisi (P1-04): /search, /fetch (Playwright), /align.
  # `tools` profilinde cunku bir tarayici ve (istege bagli) bir ASR
  # modeli tasiyor - her gelistirme oturumunda gerekmiyor.
  #
  # `docker compose --profile tools up -d tools`
  tools:
    build:
      context: ./tools
      args:
        # Hizalama varsayilan olarak KAPALI: ~1 GB bagimlilik ve
        # yalnizca ses hizalayan makinede gerekiyor. Acmak icin
        # `fetch,align` yazip yeniden derleyin.
        EXTRAS: fetch
    container_name: bmai-tools
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      # Kap icinden SearXNG'ye servis adiyla ulasiliyor; localhost
      # kabin kendisi olurdu.
      BMAI_SEARXNG_URL: "http://searxng:8080"
      BMAI_ALIGN_MODEL: "small"
      BMAI_ALIGN_DEVICE: "cpu"
      BMAI_PIPER_VOICES: "/voices"
    volumes:
      # Ses modelleri kabin DISINDA: her yeniden derlemede 63 MB'lik
      # dosyalari tekrar indirmek anlamsiz.
      - piper-voices:/voices
    ports:
      # 127.0.0.1'e bagli: bu servis disaridan gelen bir URL'yi acip
      # metnini donduruyor. Yerel aga acmak, agdaki herkese bu
      # makineden istek yaptirmak demekti.
      - "127.0.0.1:8099:8099"

  # S3 uyumlu nesne deposu (P4-02).
  #
  # NEDEN MINIO: S3 API'sini konuşuyor, ücretsiz ve tamamen yerel
  # çalışıyor. Gerçek S3'e karşı geliştirmek anahtar, hesap ve her
  # testte para demekti; MinIO aynı protokolü konuştuğu için kod
  # değişmeden R2/S3'e taşınıyor.
  #
  # `storage` profilinde: dosya sistemi deposu hâlâ varsayılan ve çoğu
  # geliştirme oturumunda nesne deposu gerekmiyor.
  minio:
    image: minio/minio:latest
    container_name: bmai-minio
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Geliştirme kimlik bilgileri — yalnızca 127.0.0.1'e bağlı bir
      # kap. Gerçek anahtarlar hiçbir zaman bu dosyaya girmez.
      MINIO_ROOT_USER: bmai
      MINIO_ROOT_PASSWORD: bmai_dev_secret
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web arayüzü
    volumes:
      - minio-data:/data
    healthcheck:
      # Uygulama, kap "başladı" dediğinde değil, gerçekten istek kabul
      # ettiğinde bağlanmalı.
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Dagitik hiz siniri ve devre kesici durumu (P4-03).
  #
  # NEDEN GEREKLI OLDU: P4-01 ile birden fazla worker gercekten kosuyor.
  # Surec ici bir hiz siniri, iki worker'da iki kat istek demek --
  # saglayici bizi keser ve sebep hicbir logda gorunmez.
  #
  # `scale` profilinde: tek makineli gelistirmede surec ici sinir
  # yeterli ve dogru.
  redis:
    image: redis:7-alpine
    container_name: bmai-redis
    profiles: ["scale"]
    restart: unless-stopped
    # KALICILIK KAPALI: burada tutulan sey ANLIK durum (kac istek
    # atildi, devre acik mi). Yeniden baslayinca sifirlanmasi dogru --
    # dunku hiz siniri sayaci bugun anlamsiz.
    command: redis-server --save "" --appendonly no
    ports:
      # 6380, 6379 DEGIL: gelistirme makinesinde zaten baska bir Redis
      # kosuyor olabiliyor (bu depoda oldu) ve varsayilan portu almak,
      # ya kabin hic baslamamasi ya da baskasinin verisine yazmak
      # demekti. Ikincisi daha sinsi.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  piper-voices:
  postgres-data:
  seq-data:
  searxng-data:
  minio-data:

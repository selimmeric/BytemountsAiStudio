[project]
name = "bmai-tools"
version = "0.1.0"
description = "BytemountsAiStudio araclar yan-servisi: /search, /fetch, /align"
requires-python = ">=3.11"

# ZORUNLU bagimliliklar yalnizca sunucunun kendisi. Agir olanlar
# (Playwright, faster-whisper) istege bagli: bir makinede yalnizca
# /search gerekiyorsa 2 GB'lik bir model indirmesi sacma olurdu.
# Hangi yetenegin acik oldugunu /health soyluyor.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
fetch = ["playwright>=1.45"]
align = ["faster-whisper>=1.0"]
tts = ["piper-tts>=1.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]

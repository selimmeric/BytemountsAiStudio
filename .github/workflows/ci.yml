name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Kalicilik testleri gercek PostgreSQL'e kosuyor. Bellek ici saglayici bu
    # semanin degerli kismini (pgvector, kismi indeks, jsonb, SKIP LOCKED)
    # taklit edemiyor; orada gecen test uretimde calisacagina dair bir sey
    # soylemez. Bu yuzden CI'da da gercek veritabani var.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bmai
          POSTGRES_PASSWORD: bmai_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bmai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      BMAI_TEST_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=bmai;Password=bmai_dev"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Test veritabanlari uygulama tarafindan olusturuluyor ama eklentiler
      # sablon veritabaninda hazir olmali; aksi halde her yeni test veritabani
      # icin `CREATE EXTENSION` yetkisi gerekirdi.
      - name: pgvector eklentisini template1'e kur
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -U bmai >/dev/null 2>&1; then break; fi
            sleep 2
          done
          PGPASSWORD=bmai_dev psql -h localhost -U bmai -d template1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      # ffmpeg KURULUYOR, testler atlanmasin diye.
      #
      # Bir dizi test "ffmpeg yoksa atla" diyor ve runner'da ffmpeg
      # olmadigi icin bunlar CI'da HIC kosmuyordu: filtre grafini gercek
      # ffmpeg'e dogrulatan testler, ses seviyesi olcumleri ve suresi
      # ffprobe ile olculen TTS testleri. Yesil bir CI, o testlerin
      # gectigi anlamina gelmiyordu - hic denenmedikleri anlamina
      # geliyordu.
      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # KAYNAK DOSYASI YOK SAYILIYOR MU.
      #
      # Bu hata iki kez oldu ve ikisinde de derleme hatasi olarak,
      # yani en gec anda goruldu. Ankrajsiz bir `storage/` deseni
      # `src/.../Storage/` kaynak klasorunu yutuyordu; `git add -A`
      # yok sayilan dosyalari SESSIZCE atliyor, yani commit basarili
      # gorunuyor ve eksik dosya ancak CI derlemesinde ortaya cikiyor.
      #
      # Burada bakmak, sebebi "StorageSelection does not exist"
      # yerine adiyla soyluyor.
      - name: Yok sayilan kaynak dosyasi var mi
        run: |
          # `obj/` ve `bin/` DISLANIYOR: oradaki `.cs` dosyalari
          # derleme sirasinda uretiliyor ve yok sayilmalari dogru.
          # Ilk yazimda dislanmamislardi ve kontrol yuzlerce satirla
          # her zaman dusuyordu -- her zaman dusen bir kontrol, hicbir
          # sey kontrol etmiyor demek.
          KAYIP=$(git ls-files --others --ignored --exclude-standard -- 'src/**/*.cs' 'tests/**/*.cs' \
                  | grep -vE '/(obj|bin)/' || true)
          if [ -n "$KAYIP" ]; then
            echo "Bu kaynak dosyalari .gitignore tarafindan yok sayiliyor:"
            echo "$KAYIP"
            echo "Muhtemelen ankrajsiz bir desen (ornegin 'storage/') kaynak klasorunu yutuyor."
            exit 1
          fi
          echo "Yok sayilan kaynak dosyasi yok."

      - name: Restore
        run: dotnet restore BytemountsAiStudio.slnx

      # Uyari = hata kurali Directory.Build.props'ta; ayrica burada da
      # --no-restore ile derleme yapiliyor ki restore hatalari ayrisabilsin.
      - name: Build
        run: dotnet build BytemountsAiStudio.slnx --no-restore -c Release

      - name: Test
        run: dotnet test BytemountsAiStudio.slnx --no-build -c Release --verbosity normal

  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pano plandan turetilir. CI'da yeniden uretip fark var mi diye bakiyoruz;
      # fark varsa biri panoyu elle duzenlemis ya da uretmeyi unutmus demektir.
      - name: Pano guncel mi
        run: |
          # Uretim damgasi HER kosuda degisiyor (tarih + saat), o yuzden
          # karsilastirmadan cikariliyor. Kontrolun amaci "sayilar planla
          # tutuyor mu", "ayni saniyede mi uretilmis" degil.
          python scripts/plan_progress.py
          if ! git diff --quiet -- docs/plan-dashboard.html; then
            if git --no-pager diff -U0 -- docs/plan-dashboard.html                  | grep -E '^[+-]' | grep -v '^[+-][+-]' | grep -qv 'class="stamp"'; then
              echo "::error::docs/plan-dashboard.html guncel degil. 'python scripts/plan_progress.py' calistirip commit'leyin."
              git --no-pager diff -- docs/plan-dashboard.html | head -40
              exit 1
            fi
            echo "Yalnizca uretim damgasi farkli; pano guncel."
          fi

  # Python yan-servisi (P1-04). AYRI is: .NET derlemesine ihtiyaci yok ve
  # bir tarayici ya da ASR modeli indirmiyor - testler agir bagimliliklara
  # DOKUNMADAN kosuyor. Sinanan sey saf mantik: kapilar, ayristirma ve
  # bozuk araliklarin duzeltilmesi.
  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bagimliliklar
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q
